name: Temporary format automation showcase

on:
  push:
    branches:
      - feat/automation-quality-showcase

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/automation-quality-showcase
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write app/projects/page.tsx components/sections/hero.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/projects/page.tsx components/sections/hero.tsx
          git commit -m "style: format automation showcase"
          git push origin HEAD:feat/automation-quality-showcase
