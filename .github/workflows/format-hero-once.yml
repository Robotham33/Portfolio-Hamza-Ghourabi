name: Format hero once

on:
  push:
    branches:
      - feat/v4-portrait-hero
    paths:
      - .github/workflows/format-hero-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-portrait-hero
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format hero with project Prettier
        run: npx prettier --write components/sections/hero.tsx
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-hero-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/sections/hero.tsx .github/workflows/format-hero-once.yml
          git commit -m "fix(ci): format hero with Prettier"
          git push origin HEAD:feat/v4-portrait-hero
