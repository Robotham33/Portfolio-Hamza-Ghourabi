name: Temporary format metadata

on:
  push:
    branches:
      - fix/social-preview-favicon-final

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-preview-favicon-final
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write app/icon.tsx app/apple-icon.tsx app/opengraph-image.tsx app/twitter-image.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/icon.tsx app/apple-icon.tsx app/opengraph-image.tsx app/twitter-image.tsx
          git commit -m "style: format metadata image routes"
          git push origin HEAD:fix/social-preview-favicon-final
