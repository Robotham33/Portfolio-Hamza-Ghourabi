name: Temporary install analytics packages

on:
  push:
    branches:
      - feat/seo-analytics

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/seo-analytics
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm install @vercel/analytics@latest @vercel/speed-insights@latest
      - name: Commit dependencies
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "feat(analytics): add Vercel analytics packages"
          git push origin HEAD:feat/seo-analytics
