name: Format release candidate once

on:
  push:
    branches:
      - feat/v4-portrait-hero
    paths:
      - .github/workflows/format-release-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v4-portrait-hero
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format release candidate
        run: |
          npx prettier --write             app/contact/page.tsx             app/layout.tsx             components/layout/site-header.tsx             components/layout/site-footer.tsx             components/sections/hero.tsx             content/portfolio.ts
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-release-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/contact/page.tsx app/layout.tsx components/layout/site-header.tsx components/layout/site-footer.tsx components/sections/hero.tsx content/portfolio.ts .github/workflows/format-release-once.yml
          git commit -m "fix(ci): format beta release candidate"
          git push origin HEAD:feat/v4-portrait-hero
