name: Temporary format branch

on:
  push:
    branches:
      - fix/french-copy-cleanup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/french-copy-cleanup
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write components/sections/hero.tsx
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/sections/hero.tsx
          git commit -m "style: apply prettier to hero"
          git push origin HEAD:fix/french-copy-cleanup
