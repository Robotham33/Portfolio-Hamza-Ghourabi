name: Quality

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Normalize repository
        if: github.event_name == 'pull_request'
        run: |
          npm run format
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json app/globals.css app/page.tsx docs/content-strategy.md docs/product-vision.md docs/roadmap.md README.md postcss.config.mjs
          if git diff --cached --quiet; then
            echo "No normalization changes to commit."
          else
            git commit -m "chore: lock dependencies and normalize formatting"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Run quality checks
        run: npm run check
