<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 350" width="1400" height="350" role="img" aria-labelledby="title desc">
  <title id="title">Des systèmes fiables pour un monde plus sûr — Hamza Ghourabi</title>
  <desc id="desc">Citation et signature en écriture blanche fine sur fond noir.</desc>
  <rect width="1400" height="350" fill="#05080c"/>
  <g fill="#F5F7FA" font-family="Georgia, Times New Roman, serif" font-style="italic" font-weight="300">
    <text x="72" y="145" font-size="64">“Des systèmes fiables</text>
    <text x="100" y="230" font-size="62">pour un monde plus sûr.”</text>
    <text x="825" y="205" font-size="92">Hamza Ghourabi</text>
  </g>
</svg>